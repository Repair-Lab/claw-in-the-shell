[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git", ".venv", "node_modules", "frontend/dist",
    "__pycache__", ".updates", ".backups",
]

[tool.ruff.lint]
# Sinnvoller Kern: Syntax/Fehler (E,F,W) + Bug-Muster (B) +
# Import-Ordnung (I) + moderne Syntax (UP).
# E501 (Zeilenlaenge) und D* (Docstrings) bewusst AUSSCHLIESSEN -
# Legacy-Code, wuerde hunderte falsche Positve erzeugen.
select = ["E", "W", "F", "B", "I", "UP"]
ignore = [
    # ── Architektur-bedingt (bewusste Wahl) ──
    "E501",   # Zeilenlaenge (Black-Territorium)
    "B008",   # Funktionaufruf in Default-Argument (FastAPI-Depends-Standard)
    "B905",   # zip-strict (py310-Feature, hier nicht erzwungen)
    "F403",   # undefined-local-with-import-star (from common import * Architektur)
    "F401",   # unused-import (via from common import * oft no-ops, Legacy-Code)
    "B007",   # unused-loop-control-variable (Legacy-Loops mit _-Variable)
    "UP043",  # typen-Quoting (Laerm)

    # ── Legacy-Code-Refactoring-Kandidaten (Phase 3.5, bewusst ignoriert) ──
    "UP006",  # non-PEP585-annotation (List[int] -> list[int], 66 Stellen)
    "UP045",  # non-PEP604-annotation (Optional[X] -> X | None, 83 Stellen)
    "UP035",  # deprecated-import (from typing import ..., 16 Stellen)
    "UP042",  # replace-str-enum (2 Stellen)
    "I001",   # unsorted-imports (Legacy-Import-Reihenfolge, 61 Stellen)

    # ── Style/Whitespace (bewusst ignoriert) ──
    "E701",   # multiple-statements-on-one-line-colon (Legacy-Single-Liner)
    "F405",   # undefined-local-with-import-star-usage (from common import * Architektur, 982x)
    "F841",   # unused-variable (Legacy)
    "B904",   # raise-without-from (Legacy)
    "B006",   # mutable-argument-default (Legacy)
    "W291",   # trailing-whitespace
    "W293",   # blank-line-with-whitespace
    "E712",   # true-false-comparison
    "E722",   # bare-except (intentionale Catch-All)
    "E741",   # ambiguous-variable-name
    "UP031",  # printf-string-formatting
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]
"web/common.py" = ["E402"]
